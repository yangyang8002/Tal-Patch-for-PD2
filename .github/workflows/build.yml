name: Build TAL-Patch (Zygisk)

on:
  push:
    branches: [ master, zygisk-webui ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 直接使用 runner 预装 Android SDK：android-actions/setup-android@v3
      # 在 runner 镜像更新（Node 24）后 sdkmanager --licenses 会失败。
      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)"
          echo "sdk=$SDK"
          echo "sdkmanager=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Install NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)"
          yes | "$SDKMANAGER" --install "ndk;26.1.10909125" >/dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"

      # DexBuilder 需要 CMake >= 3.28，Dobby 与 CMake 4.x 不兼容
      - name: Install CMake 3.31 & Ninja
        run: pip install "cmake==3.31.*" ninja

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build loader (Java → classes.jar)
        run: sh ./gradlew :loader:assembleRelease

      - name: Build native (CMake) & package module zip
        run: python3 build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tal-patch-zygisk
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
